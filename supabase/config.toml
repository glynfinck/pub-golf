# Ports offset from the `home` project (54321-54329) so both local stacks
# can run at once.
project_id = "pub-golf"

[api]
enabled = true
port = 54331
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54332
shadow_port = 54330
major_version = 17

[studio]
enabled = true
port = 54333

[inbucket]
enabled = true
port = 54334

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3105"
additional_redirect_urls = ["http://localhost:3105", "http://localhost:3000"]
# Guests join rounds without an account (Kahoot/Jackbox pattern) — they get
# an anonymous session so RLS still has an auth.uid() to key on.
enable_anonymous_sign_ins = true

# A guest claims their card by linking Google to the anonymous uid they
# already hold, which keeps every round already on that uid. Linking an
# identity to a signed-in user requires manual linking to be enabled — it is
# off by default, and the claim button fails without it. Production needs the
# same switch set (Authentication -> Advanced).
enable_manual_linking = true

[auth.sms]
enable_signup = false

# Sign-in is Google-only: no OTP codes, no magic links, and therefore no SMTP
# dependency in production. The email provider stays on *locally* purely so
# the e2e suite can seed a host session with admin-created credentials
# (e2e/auth.ts) — nothing in the UI reaches it, and production leaves Google
# as the only enabled provider.
[auth.email]
enable_signup = true
enable_confirmations = false

# Google sign-in. Local dev needs a Google Cloud OAuth client with
# http://127.0.0.1:54331/auth/v1/callback as an authorized redirect URI;
# skip_nonce_check is required for the local flow.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = true

[realtime]
enabled = true

# Analytics defaults to port 54327, which the `home` stack occupies.
[analytics]
enabled = false
