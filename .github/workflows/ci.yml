name: CI

# `main` and `preview` are the two release branches. Both are deployed by the
# platforms themselves, not from here — Vercel's git integration builds the
# app, Supabase's GitHub integration applies the migrations. See DEPLOYMENT.md.
#
# So this workflow ships nothing. It is the proof, not the pipeline: it must
# stay a required status check on both branches, because a merge is the only
# thing that reaches a release branch and a deploy follows it unconditionally.
on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]

# One run per ref; a newer push supersedes an in-flight one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # verify: lint + typecheck + build + a full two-player round in Playwright,
  # all against a real local Supabase spun up in the runner. Every PR and push.
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22+: @supabase/supabase-js needs a native WebSocket
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Pure logic — scoring substitutions, placings, clock and walk maths.
      # Runs before Docker: the whole tier costs less than one `supabase
      # start`, so a broken leaderboard never pays for a container boot.
      - name: Unit tests
        run: npm test

      # Moved above `supabase start`: tsc needs no stack, so a type error is
      # reported in seconds rather than after the stack has come up.
      - name: Typecheck
        run: npm run typecheck

      # The Stripe sandbox tier, in the gate by decision: the one step that
      # talks to a third party, accepted because it is test mode only (the
      # suite refuses a live key), four small API calls, and green-with-skips
      # when no STRIPE_SANDBOX_SECRET_KEY exists (forks never see secrets).
      # Seeding first is idempotent, so a fresh sandbox can never fail the
      # gate for being empty. Runs before the stack: no Docker, fails fast.
      - name: Stripe sandbox (seed + smoke)
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
        run: |
          node scripts/stripe-seed.mjs
          npm run test:stripe

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: |
          supabase start
          supabase db reset   # deterministic: re-applies migrations from scratch

      # The service role key is spent two ways: the e2e suite seeds host
      # sessions with the admin API (Google's consent screen can't be driven
      # here), and the db suite reads rows back past RLS with it.
      #
      # `jq -r` prints the string "null" for a field that isn't there, so a key
      # that failed to resolve used to end up in .env.local looking perfectly
      # real and only announced itself much later as a permission error. Each
      # value is checked here instead, where the log still says which one.
      - name: Point the app at local Supabase
        run: |
          STATUS=$(supabase status -o json)
          API_URL=$(jq -r '.API_URL // empty' <<<"$STATUS")
          ANON=$(jq -r '.ANON_KEY // .PUBLISHABLE_KEY // empty' <<<"$STATUS")
          SERVICE=$(jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY // empty' <<<"$STATUS")

          missing=""
          [ -n "$API_URL" ] || missing="$missing API_URL"
          [ -n "$ANON" ]    || missing="$missing ANON_KEY"
          [ -n "$SERVICE" ] || missing="$missing SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=Supabase status is missing keys::supabase status -o json had no:$missing"
            echo "Fields it did offer: $(jq -r 'keys | join(", ")' <<<"$STATUS")"
            exit 1
          fi

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE"
            # Billing touches no real Stripe anywhere in CI. The webhook spec
            # signs its own events with this dummy secret (Stripe's own
            # generateTestHeaderString), and the dummy secret key only has to
            # be non-empty for the route to consider billing configured —
            # neither value is ever sent to Stripe.
            echo "STRIPE_SECRET_KEY=sk_test_ci_dummy"
            echo "STRIPE_WEBHOOK_SECRET=whsec_ci_dummy"
          } >> .env.local

      # RLS is the app's real access control — every server action reaches
      # Postgres through PostgREST on the caller's own session — so it is
      # verified against the database directly, and before the build: a policy
      # regression should not wait on webpack and a browser download.
      - name: RLS + database tests
        run: npm run test:db

      # The same stack, crowded: twenty sessions on one round — the join
      # stampede, the score storm, the mulligan burst, a full eighteen-hole
      # card. Races only surface under contention, so this tier is in the
      # gate rather than on a schedule: a nightly red is a report nobody
      # owns, a PR red is a diff somebody is already looking at.
      - name: Stress tests (twenty sessions)
        run: npm run test:stress

      - name: Build
        run: npm run build

      # Browser contexts play full rounds against the seeded stack above:
      # create, guest join, caddy controls, live score sync, a four-phone
      # foursome, results. The host session is minted with the admin API in
      # e2e/auth.ts — Google's consent screen cannot be driven from CI.
      #
      # Three engines, because playwright.config.ts runs a platform matrix
      # (Android Chrome, iOS Safari, desktop Firefox) and the suite fails at
      # startup if an engine in the matrix has no browser installed.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: E2E tests (Playwright)
        run: npm run test:e2e

      # Both halves are real now: playwright-report/ carries the html report
      # the CI reporter writes, and test-results/ holds each failure's
      # error-context.md (the page snapshot at the moment it failed, error
      # toasts included) plus the step-by-step trace.zip recorded for any
      # test that needed a retry — open it at trace.playwright.dev.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true
